name: fork-sync

on:
  schedule:
    # Daily, 06:17 UTC. Off the hour so it does not queue behind the cron rush.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Report only, change nothing
        type: boolean
        default: false
      diverged:
        description: What to do with forks that have local commits ahead of upstream
        type: choice
        options: [skip, merge]
        default: skip

permissions:
  contents: read

concurrency:
  group: fork-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: python -m unittest -v

      - name: Sync public forks
        env:
          # A PAT is required: GITHUB_TOKEN cannot write to sibling repositories.
          GITHUB_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
          FORK_OWNER: ${{ github.repository_owner }}
          DRY_RUN: ${{ inputs.dry_run }}
          DIVERGED: ${{ inputs.diverged }}
        run: |
          set -euo pipefail
          args=(--owner "$FORK_OWNER" --diverged "${DIVERGED:-skip}" --json-out plan.json)
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          python sync.py "${args[@]}"

      - name: Upload plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-plan
          path: plan.json
          if-no-files-found: ignore
          retention-days: 14
